
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas!</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #102c35, #06131c);
            color: white;
            font-family: monospace;
            text-align: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-top: 35px;
            color: #e8f5e9;
            font-size: clamp(24px, 5vw, 42px);
            text-shadow: 0 0 15px #8cffb0;
        }

        #tree {
            position: relative;
            z-index: 1;
            white-space: pre;
            font-size: clamp(10px, 2.5vw, 20px);
            line-height: 1.15;
            color: #36c66b;
            text-shadow: 0 0 8px #20a84e;
            margin-top: 20px;
        }

        .star {
            color: gold;
            text-shadow: 0 0 15px yellow;
            animation: glow 1s infinite alternate;
        }

        .light {
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        @keyframes glow {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        #message {
            margin-top: 25px;
            font-size: 18px;
            color: #d8e9ef;
            text-shadow: 0 0 10px white;
        }

        #snow {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>

<body>

    <canvas id="snow"></canvas>

    <h1>Merry Christmas!</h1>

    <div id="tree"></div>

    <div id="message">
        ❄ Wishing You a Wonderful Christmas ❄
    </div>

    <script>
        // CREATE CHRISTMAS TREE

        const tree = document.getElementById("tree");

        const colors = [
            "#ff3333",
            "#ffff44",
            "#44ccff",
            "#ff66cc",
            "#ffffff"
        ];

        let treeHTML = "";

        treeHTML += '<span class="star">       ★</span>\n';

        for (let i = 1; i <= 10; i++) {

            let row = " ".repeat(10 - i);

            for (let j = 0; j < (i * 2 - 1); j++) {

                if (Math.random() < 0.12) {

                    let color = colors[
                        Math.floor(Math.random() * colors.length)
                    ];

                    row += `<span class="light" style="color:${color}">
                            ●</span>`;

                } else {
                    row += "*";
                }
            }

            treeHTML += row + "\n";
        }

        treeHTML += "         |||\n";
        treeHTML += "         |||\n";
        treeHTML += "        [___]";

        tree.innerHTML = treeHTML;


        // CREATE FALLING SNOW

        const canvas = document.getElementById("snow");
        const ctx = canvas.getContext("2d");

        let snowflakes = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 150; i++) {

            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3 + 1,
                speed: Math.random() * 2 + 0.5,
                drift: Math.random() * 1 - 0.5
            });
        }

        function animateSnow() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";

            snowflakes.forEach(flake => {

                ctx.beginPath();

                ctx.arc(
                    flake.x,
                    flake.y,
                    flake.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

                flake.y += flake.speed;
                flake.x += flake.drift;

                if (flake.y > canvas.height) {
                    flake.y = -5;
                    flake.x = Math.random() * canvas.width;
                }

                if (flake.x > canvas.width) {
                    flake.x = 0;
                }

                if (flake.x < 0) {
                    flake.x = canvas.width;
                }

            });

            requestAnimationFrame(animateSnow);
        }

        animateSnow();

    </script>

</body>
</html>
