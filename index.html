
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 50% 65%, #263b35 0%, #142820 38%, #091713 100%);
            color: #fff4d6;
            font-family: "Courier New", monospace;
            text-align: center;
        }

        h1 {
            position: relative;
            z-index: 3;
            margin-top: 35px;
            font-size: clamp(25px, 5vw, 42px);
            letter-spacing: 4px;
            color: #f6e5b8;
            text-shadow:
                0 0 8px #d4a85a,
                0 0 20px rgba(255, 190, 90, 0.4);
            animation: titleGlow 3s infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 8px #d4a85a;
            }
            to {
                text-shadow: 0 0 15px #e6bb70,
                             0 0 30px rgba(255, 190, 90, 0.5);
            }
        }

        #tree-container {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            margin-top: 10px;
        }

        #tree {
            white-space: pre;
            font-family: "Courier New", monospace;
            font-size: clamp(7px, 1.65vw, 17px);
            font-weight: bold;
            line-height: 1.08;
            text-align: left;
            color: #4eaa63;
            text-shadow: 0 0 5px rgba(63, 180, 91, 0.4);
        }

        .branch {
            color: #399455;
        }

        .dark-branch {
            color: #286b43;
        }

        .trunk {
            color: #ad7950;
        }

        .star {
            color: #ffdc76;
            text-shadow:
                0 0 5px #fff0a0,
                0 0 15px #ffc94d,
                0 0 30px #ffae36;
        }

        .light {
            display: inline-block;
            animation: bulbGlow var(--speed) ease-in-out infinite alternate;
            animation-delay: var(--delay);
        }

        .red {
            color: #ff5353;
            text-shadow: 0 0 5px #ff3333, 0 0 12px #ff3333;
        }

        .yellow {
            color: #ffe17a;
            text-shadow: 0 0 6px #ffdb55, 0 0 14px #ffca35;
        }

        .blue {
            color: #72caff;
            text-shadow: 0 0 6px #55baff, 0 0 14px #55baff;
        }

        .orange {
            color: #ffa85b;
            text-shadow: 0 0 6px #ff9933, 0 0 14px #ff8833;
        }

        .green {
            color: #91ed83;
            text-shadow: 0 0 6px #66ee55, 0 0 14px #66ee55;
        }

        @keyframes bulbGlow {
            0% {
                opacity: 0.55;
                filter: brightness(0.7);
            }
            100% {
                opacity: 1;
                filter: brightness(1.5);
            }
        }

        #message {
            position: relative;
            z-index: 3;
            margin-top: 20px;
            font-size: clamp(12px, 2vw, 17px);
            letter-spacing: 2px;
            color: #e9d8b0;
            text-shadow: 0 0 10px rgba(255, 218, 155, 0.5);
        }

        #snow {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .ground-glow {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            height: 180px;
            background: rgba(255, 202, 120, 0.07);
            filter: blur(60px);
            border-radius: 50%;
            pointer-events: none;
        }

        @media (max-width: 500px) {
            h1 {
                margin-top: 45px;
            }

            #tree {
                font-size: clamp(6px, 1.75vw, 9px);
            }

            #message {
                margin-top: 15px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>

    <canvas id="snow"></canvas>

    <h1>MERRY CHRISTMAS</h1>

    <div id="tree-container">
        <div id="tree"></div>
    </div>

    <div id="message">
        ✦ Wishing You a Wonderful Christmas ✦
    </div>

    <div class="ground-glow"></div>

    <script>

        // ==========================================
        // CHRISTMAS TREE DESIGN
        // ==========================================

        const tree = document.getElementById("tree");

        const height = 25;
        const width = height * 2 - 1;

        const bulbs = [
            "red",
            "yellow",
            "blue",
            "orange",
            "green"
        ];

        let rows = [];

        function createTree() {

            rows = [];

            // Tree star
            rows.push(
                ' '.repeat(height - 1) +
                '<span class="star">✦</span>'
            );

            // Tree branches
            for (let i = 1; i <= height; i++) {

                let row = "";

                let spaces = height - i;

                row += " ".repeat(spaces);

                for (let j = 0; j < (i * 2 - 1); j++) {

                    let random = Math.random();

                    if (random < 0.075) {

                        let color = bulbs[
                            Math.floor(Math.random() * bulbs.length)
                        ];

                        let delay = (Math.random() * 2).toFixed(2);
                        let speed = (0.7 + Math.random() * 1.8).toFixed(2);

                        row += `<span class="light ${color}"
                            style="--delay:${delay}s; --speed:${speed}s">●</span>`;

                    } else if (random < 0.17) {

                        row += '<span class="dark-branch">✦</span>';

                    } else if (random < 0.35) {

                        row += '<span class="branch">+</span>';

                    } else {

                        row += '<span class="branch">*</span>';
                    }
                }

                rows.push(row);
            }

            // Decorative bottom branches
            rows.push(
                " ".repeat(height - 3) +
                '<span class="branch">/^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\\</span>'
            );

            // Tree trunk
            rows.push(
                " ".repeat(height - 2) +
                '<span class="trunk">|||||||</span>'
            );

            rows.push(
                " ".repeat(height - 2) +
                '<span class="trunk">|||||||</span>'
            );

            // Tree base
            rows.push(
                " ".repeat(height - 4) +
                '<span class="trunk">[===============]</span>'
            );
        }


        // ==========================================
        // TREE BUILD ANIMATION
        // ==========================================

        function buildTree() {

            tree.innerHTML = "";

            let currentRow = rows.length - 1;

            function addRow() {

                if (currentRow < 0) {
                    return;
                }

                const row = rows[currentRow];

                const line = document.createElement("div");

                line.innerHTML = row;

                line.style.opacity = "0";
                line.style.transform = "rotateX(90deg) scale(0.2)";
                line.style.transformOrigin = "center center";
                line.style.transition =
                    "opacity 0.45s ease, transform 0.65s cubic-bezier(.2,.8,.3,1)";

                tree.prepend(line);

                requestAnimationFrame(() => {

                    line.style.opacity = "1";
                    line.style.transform = "rotateX(0deg) scale(1)";

                });

                currentRow--;

                setTimeout(addRow, 85);
            }

            addRow();
        }


        createTree();
        buildTree();


        // ==========================================
        // FALLING PIXEL SNOW
        // ==========================================

        const canvas = document.getElementById("snow");
        const ctx = canvas.getContext("2d");

        let snowflakes = [];

        function resizeCanvas() {

            const ratio = window.devicePixelRatio || 1;

            canvas.width = window.innerWidth * ratio;
            canvas.height = window.innerHeight * ratio;

            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();

        function createSnow() {

            snowflakes = [];

            for (let i = 0; i < 130; i++) {

                snowflakes.push({

                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,

                    size: Math.random() * 2 + 1,

                    speed: Math.random() * 0.45 + 0.2,

                    drift: Math.random() * 0.3 - 0.15,

                    opacity: Math.random() * 0.55 + 0.25

                });
            }
        }

        createSnow();

        function animateSnow() {

            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );

            snowflakes.forEach(flake => {

                ctx.fillStyle =
                    `rgba(255, 250, 235, ${flake.opacity})`;

                ctx.fillRect(
                    Math.round(flake.x),
                    Math.round(flake.y),
                    flake.size,
                    flake.size
                );

                flake.y += flake.speed;
                flake.x += flake.drift;

                if (flake.y > window.innerHeight) {

                    flake.y = -5;
                    flake.x = Math.random() * window.innerWidth;

                }

                if (flake.x > window.innerWidth) {
                    flake.x = 0;
                }

                if (flake.x < 0) {
                    flake.x = window.innerWidth;
                }

            });

            requestAnimationFrame(animateSnow);
        }

        animateSnow();

    </script>

</body>
</html>
